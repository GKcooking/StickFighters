<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stick Fighters - Wave & Boss Mode</title>
    <style>
        body { margin:0; overflow:hidden; background:#111; font-family: sans-serif; color: white; width: 100vw; height: 100vh; }
        canvas { display:block; background: #1a1a1a; width: 100%; height: 100%; }
        #ui { position:fixed; top:10px; left:10px; pointer-events: none; text-shadow: 2px 2px 4px #000; z-index: 10; }
        #wave-ui { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #00ffff; font-weight: bold; z-index: 10; }
        #boss-hp { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); width: 300px; height: 15px; background: #333; border: 2px solid white; display: none; z-index: 10; }
        #boss-bar { height: 100%; width: 100%; background: red; }
        #hotbar { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; z-index: 100; border: 1px solid #444; }
        .slot { width: 45px; height: 45px; border: 2px solid #555; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; background: #222; border-radius: 5px; color: #aaa; }
        .slot.active { border-color: #00ffff; box-shadow: 0 0 10px #00ffff; color: white; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; text-align: center;}
        button, .weapon-card { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 10px; border: none; background: #00ffff; font-weight: bold; margin: 10px; color: #111; }
        .weapon-card { background: #333; color: white; border: 2px solid #444; width: 150px; }
        .weapon-card:hover { border-color: #00ffff; background: #444; }
        h1 { font-size: 60px; color: #00ffff; text-shadow: 0 0 20px #00ffff; }
    </style>
</head>
<body>

<div id="start-menu" class="overlay">
    <h1>Stick Fighters</h1>
    <p>Reach 500 & 1000 Score to summon Bosses</p>
    <button onclick="startGame()">START MISSION</button>
</div>

<div id="ui">
    SCORE: <span id="score-text">0</span><br>
    HP: <span id="hp-text">100</span>
</div>

<div id="wave-ui">WAVE 1 - 00:30</div>
<div id="boss-hp"><div id="boss-bar"></div></div>
<div id="hotbar"></div>

<div id="upgrade-menu" class="overlay" style="display:none;">
    <h2>WAVE CLEARED!</h2>
    <p>Choose your next weapon:</p>
    <div id="weapon-options" style="display: flex;"></div>
</div>

<div id="victory-screen" class="overlay" style="display:none;">
    <h1>VICTORY!</h1>
    <p>Final Boss Eliminated.</p>
    <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<div id="game-over" class="overlay" style="display:none;">
    <h1 style="color:red;">MISSION FAILED</h1>
    <button onclick="location.reload()">RETRY</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Configuration & State
let player = { x: 0, y: 0, speed: 6, health: 100 };
let camera = { x: 0, y: 0 };
let bullets = [], enemies = [], activeBoss = null;
let score = 0, lastFire = 0, gameRunning = false;
let waveTime = 30, waveNumber = 1, lastWaveUpdate = Date.now();

const WEAPON_TYPES = [
    { name: "Pistol", rate: 400, speed: 15, damage: 2, spread: 0, color: "yellow" },
    { name: "SMG", rate: 100, speed: 20, damage: 1, spread: 0.1, color: "cyan" },
    { name: "Shotgun", rate: 800, speed: 12, damage: 1.5, count: 6, spread: 0.4, color: "orange" },
    { name: "Sniper", rate: 1200, speed: 40, damage: 20, spread: 0, color: "white" },
    { name: "Laser", rate: 60, speed: 25, damage: 0.8, spread: 0.05, color: "red" },
    { name: "Heavy", rate: 500, speed: 14, damage: 8, spread: 0.1, color: "purple" },
    { name: "Minigun", rate: 40, speed: 22, damage: 0.5, spread: 0.2, color: "yellow" },
    { name: "Plasma", rate: 700, speed: 10, damage: 15, color: "lime" },
    { name: "Nailer", rate: 150, speed: 18, damage: 2, spread: 0.02, color: "#ccc" },
    { name: "ERASER", rate: 1500, speed: 50, damage: 100, color: "gold" }
];

let myWeapons = [WEAPON_TYPES[0]]; // Start with Pistol
let currentWepIdx = 0;
let keys = {}, mouse = { x: 0, y: 0, down: false };

// Inputs
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener("mousedown", () => mouse.down = true);
window.addEventListener("mouseup", () => mouse.down = false);
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

function startGame() {
    document.getElementById("start-menu").style.display = "none";
    gameRunning = true;
    initHotbar();
    loop();
}

function initHotbar() {
    const bar = document.getElementById("hotbar");
    bar.innerHTML = "";
    for(let i=0; i<10; i++) {
        let slot = document.createElement("div");
        slot.className = `slot ${i === currentWepIdx ? 'active' : ''}`;
        slot.innerHTML = `<span>${(i+1)%10}</span><b>${myWeapons[i] ? myWeapons[i].name : "---"}</b>`;
        bar.appendChild(slot);
    }
}

function showUpgrade() {
    gameRunning = false;
    const menu = document.getElementById("upgrade-menu");
    const options = document.getElementById("weapon-options");
    options.innerHTML = "";
    menu.style.display = "flex";

    let available = WEAPON_TYPES.filter(w => !myWeapons.find(mw => mw.name === w.name));
    if (available.length === 0) { gameRunning = true; return; }

    available.sort(() => 0.5 - Math.random()).slice(0, 2).forEach(w => {
        let card = document.createElement("div");
        card.className = "weapon-card";
        card.innerHTML = `<h3>${w.name}</h3>`;
        card.onclick = () => {
            myWeapons.push(w);
            initHotbar();
            menu.style.display = "none";
            gameRunning = true;
            waveNumber++;
            waveTime = 30;
            requestAnimationFrame(loop);
        };
        options.appendChild(card);
    });
}

function drawStickman(x, y, color, angle, moving, scale = 1) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3 * scale;
    ctx.lineCap = "round";
    let walk = moving ? Math.sin(Date.now() / 100) * 10 : 0;
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, -20 * scale, 6 * scale, 0, Math.PI * 2); ctx.stroke(); // Head
    ctx.beginPath(); ctx.moveTo(0, -14 * scale); ctx.lineTo(0, 5 * scale); ctx.stroke(); // Body
    ctx.beginPath(); ctx.moveTo(0, 5 * scale); ctx.lineTo(-walk * scale, 20 * scale); ctx.stroke(); // Legs
    ctx.beginPath(); ctx.moveTo(0, 5 * scale); ctx.lineTo(walk * scale, 20 * scale); ctx.stroke();
    ctx.restore();
}

function update() {
    if (!gameRunning) return;

    // Wave Timer
    if (Date.now() - lastWaveUpdate > 1000) {
        waveTime--;
        lastWaveUpdate = Date.now();
        document.getElementById("wave-ui").innerText = `WAVE ${waveNumber} - 00:${waveTime < 10 ? '0'+waveTime : waveTime}`;
        if (waveTime <= 0) { showUpgrade(); return; }
    }

    // Boss Spawning
    if (score >= 500 && score < 1000 && !activeBoss && waveNumber < 10) {
        activeBoss = { x: player.x + 800, y: player.y, health: 400, maxHealth: 400, speed: 2, scale: 4, color: "purple" };
        document.getElementById("boss-hp").style.display = "block";
    }
    if (score >= 1000 && !activeBoss) {
        activeBoss = { x: player.x + 800, y: player.y, health: 1000, maxHealth: 1000, speed: 2.5, scale: 6, color: "gold" };
        document.getElementById("boss-hp").style.display = "block";
    }

    // Movement
    let moveX = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    let moveY = (keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0);
    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    // Hotbar Switching
    for(let i=1; i<=10; i++) {
        if(keys[i%10]) { if(myWeapons[i-1]) { currentWepIdx = i-1; initHotbar(); } }
    }

    // Shooting
    const angle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);
    const wep = myWeapons[currentWepIdx];
    if (mouse.down && Date.now() - lastFire > wep.rate) {
        const count = wep.count || 1;
        for(let i=0; i<count; i++){
            let s = (Math.random() - 0.5) * (wep.spread || 0);
            bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle+s)*wep.speed, vy: Math.sin(angle+s)*wep.speed, damage: wep.damage, color: wep.color });
        }
        lastFire = Date.now();
    }

    // Bullet Logic
    bullets.forEach((b, i) => {
        b.x += b.vx; b.y += b.vy;
        if (Math.hypot(b.x - player.x, b.y - player.y) > 1500) bullets.splice(i, 1);
    });

    // Boss Logic
    if (activeBoss) {
        let dx = player.x - activeBoss.x, dy = player.y - activeBoss.y, dist = Math.hypot(dx, dy);
        activeBoss.x += (dx / dist) * activeBoss.speed;
        activeBoss.y += (dy / dist) * activeBoss.speed;
        bullets.forEach((b, bi) => {
            if (Math.hypot(activeBoss.x - b.x, activeBoss.y - b.y) < activeBoss.scale * 15) {
                activeBoss.health -= b.damage; bullets.splice(bi, 1);
                document.getElementById("boss-bar").style.width = (activeBoss.health / activeBoss.maxHealth * 100) + "%";
                if (activeBoss.health <= 0) { 
                    if (score >= 1000) { gameRunning = false; document.getElementById("victory-screen").style.display = "flex"; }
                    activeBoss = null; document.getElementById("boss-hp").style.display = "none";
                    score += 100;
                }
            }
        });
    }

    // Enemy Logic
    enemies.forEach((e, i) => {
        let dx = player.x - e.x, dy = player.y - e.y, dist = Math.hypot(dx, dy);
        e.x += (dx / dist) * e.speed; e.y += (dy / dist) * e.speed;
        bullets.forEach((b, bi) => {
            if (Math.hypot(e.x - b.x, e.y - b.y) < 20) {
                e.hp -= b.damage; bullets.splice(bi, 1);
                if (e.hp <= 0) { enemies.splice(i, 1); score += 10; document.getElementById("score-text").innerText = score; }
            }
        });
        if (dist < 20) { 
            player.health -= 0.2; 
            document.getElementById("hp-text").innerText = Math.ceil(player.health);
            if (player.health <= 0) endGame(); 
        }
    });

    if (Math.random() < 0.04 && enemies.length < 20) {
        let ang = Math.random() * Math.PI * 2;
        enemies.push({ x: player.x + Math.cos(ang)*800, y: player.y + Math.sin(ang)*800, hp: 2, speed: 2 + Math.random()*2 });
    }
    
    camera.x = player.x - canvas.width/2;
    camera.y = player.y - canvas.height/2;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // Floor
    ctx.strokeStyle = "#222";
    for(let i=-2000; i<2000; i+=100) {
        ctx.beginPath(); ctx.moveTo(i, -2000); ctx.lineTo(i, 2000); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-2000, i); ctx.lineTo(2000, i); ctx.stroke();
    }

    if (activeBoss) drawStickman(activeBoss.x, activeBoss.y, activeBoss.color, 0, true, activeBoss.scale);
    enemies.forEach(e => drawStickman(e.x, e.y, "red", 0, true));
    bullets.forEach(b => { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
    drawStickman(player.x, player.y, "#00ffff", 0, (keys['w']||keys['a']||keys['s']||keys['d']), 1);
    
    ctx.restore();
}

function loop() {
    update();
    draw();
    if(gameRunning) requestAnimationFrame(loop);
}

function endGame() {
    gameRunning = false;
    document.getElementById("game-over").style.display = "flex";
}
</script>
</body>
</html>
